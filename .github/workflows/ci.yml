name: Offline acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Windows / Python 3.11 / Node 24
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - name: Install Python test and API dependencies
        run: python -m pip install -e ".[api,model,dev]"
      - name: Install locked frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Python tests and offline Agent/API contracts (no skips)
        run: python -X utf8 -B scripts/verify.py python
      - name: Frontend tests (no skips), type check and build
        run: python -X utf8 -B scripts/verify.py web
      - name: Same-origin compiled resources and wheel contents
        run: python -X utf8 -B scripts/verify.py bundle
